
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | IT Service Desk</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow border-0" style="max-width: 420px; width: 100%;">

            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h3 class="fw-bold">IT Service Desk</h3>
                    <p class="text-muted">Sistema de gestión de incidencias TI</p>
                </div>

                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensaje in mensajes %}
                        <div class="alert alert-{{ categoria }} alert-dismissible fade show">
                            {{ mensaje }}
                            <button type="button" class="btn-close"
                                data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}">

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>

                        <input
                            type="email"
                            name="correo"
                            class="form-control"
                            placeholder="usuario@empresa.com"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>

                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">
                        IT Service Desk | Soporte TI
                    </small>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
