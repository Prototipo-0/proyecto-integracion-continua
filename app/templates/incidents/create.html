
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva incidencia | IT Service Desk</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard.index') }}">
                IT Service Desk
            </a>

            <a href="{{ url_for('auth.logout') }}"
               class="btn btn-outline-light btn-sm">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-white py-3">
                        <h4 class="mb-0">Registrar nueva incidencia</h4>
                    </div>

                    <div class="card-body p-4">

                        {% with mensajes = get_flashed_messages(with_categories=true) %}
                            {% for categoria, mensaje in mensajes %}
                                <div class="alert alert-{{ categoria }}">
                                    {{ mensaje }}
                                </div>
                            {% endfor %}
                        {% endwith %}

                        <form method="POST"
                              action="{{ url_for('incidents.create') }}">

                            <div class="mb-3">
                                <label class="form-label">
                                    Título de la incidencia
                                </label>

                                <input
                                    type="text"
                                    name="titulo"
                                    class="form-control"
                                    maxlength="200"
                                    placeholder="Ej. Problemas de conectividad"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Descripción del problema
                                </label>

                                <textarea
                                    name="descripcion"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Describe detalladamente el problema..."
                                    required
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Categoría
                                </label>

                                <select
                                    name="categoria_id"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Selecciona una categoría
                                    </option>

                                    {% for categoria in categorias %}
                                        <option value="{{ categoria.id }}">
                                            {{ categoria.nombre }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">
                                    Prioridad
                                </label>

                                <select
                                    name="prioridad_id"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Selecciona una prioridad
                                    </option>

                                    {% for prioridad in prioridades %}
                                        <option value="{{ prioridad.id }}">
                                            {{ prioridad.nombre }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">

                                <a href="{{ url_for('incidents.index') }}"
                                   class="btn btn-secondary">
                                    Cancelar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Registrar incidencia
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
